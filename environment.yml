name: miws26

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12        # pymatchmaker requires python <3.13
  - pip
  - tqdm
  - cython
  - portaudio          # required by pyaudio
  - fluidsynth         # required by pyfluidsynth

  - pip:
    - partitura @ git+https://github.com/CPJKU/partitura.git@develop
    - numpy
    - scipy
    - pandas
    - matplotlib
    - scikit-learn
    - librosa
    - numba
    - torch
    - torchvision
    - python-rtmidi
    - SoundFile
    - fastdtw
    - python-hiddenmarkov
    - appdirs
    - ipympl
    - ipywidgets
    - jupyter
    - ipython
    - pyaudio
    - pyfluidsynth
    - parangonar[accelerated]
    - pymatchmaker @ git+https://github.com/pymatchmaker/matchmaker.git@develop
    # synctoolbox from GitHub: the PyPI release (1.4.2) does not include feature.visualization
    - synctoolbox @ git+https://github.com/groupmm/synctoolbox.git
    - libtsm
    - libsoni
    - yt-dlp
